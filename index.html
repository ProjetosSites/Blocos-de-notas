<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NoteFlow — seu espaço para ideias</title>
<meta name="description" content="Escolha seu jeito de escrever, organizar e visualizar suas anotações.">
<meta name="theme-color" content="#6f5cf4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root { --background:#f8f8fb; --foreground:#292633; --muted:#777386; --line:#e8e5ee; --purple:#6f5cf4; --purple-soft:#eeebff; --card:#ffffff; --shadow:0 12px 34px rgba(44,37,76,.07); }
.dark { --background:#17151e; --foreground:#f7f5ff; --muted:#aaa5b9; --line:#322e3d; --card:#211e2b; --purple-soft:#2b2650; --shadow:0 12px 34px rgba(0,0,0,.24); }
* { box-sizing:border-box; border-color:var(--line); }
body { margin:0; background:var(--background); color:var(--foreground); font-family:Arial,Helvetica,sans-serif; }
button,input,textarea,select { font:inherit; } button { cursor:pointer; color:inherit; background:none; border:0; }
.app-shell,.picker-page,.editor-page { min-height:100vh; max-width:1120px; margin:auto; padding-bottom:90px; }
.topbar,.picker-header,.editor-header { display:flex; align-items:center; justify-content:space-between; padding:26px 30px 12px; }
.brand-mark,.mini-brand,.editor-model { display:flex; gap:11px; align-items:center; }
.brand-icon,.model-icon { display:grid; place-items:center; width:39px; height:39px; border-radius:13px; background:var(--purple); color:#fff; flex-shrink:0; }
.brand-icon svg,.model-icon svg { width:20px; height:20px; }
.brand-name { display:block; font-weight:800; letter-spacing:-.04em; font-size:20px; }
.brand-tag { display:block; font-size:10px; color:var(--muted); letter-spacing:.03em; margin-top:2px; }
.mini-brand span { font-weight:800; }
.top-actions,.editor-actions { display:flex; gap:7px; align-items:center; }
.icon-button { border:0; background:transparent; padding:10px; border-radius:12px; display:grid; place-items:center; }
.icon-button:hover { background:var(--purple-soft); }
.icon-button svg { width:19px; height:19px; }
.avatar { border:0; background:#ffd2b7; color:#8c5138; width:34px; height:34px; border-radius:50%; font-weight:700; }
.content { padding:38px 30px; }
.welcome { display:flex; justify-content:space-between; align-items:end; margin:30px 0 28px; }
.eyebrow { color:var(--purple); letter-spacing:.15em; font-size:10px; font-weight:800; margin:0 0 9px; }
.welcome h1,.picker-intro h1,.page-heading h1 { font-size:clamp(32px,5vw,48px); letter-spacing:-.06em; line-height:.98; margin:0; }
.welcome em,.picker-intro em { color:var(--purple); font-style:normal; }
.cloud-status { display:flex; gap:7px; align-items:center; font-size:11px; color:var(--muted); }
.cloud-status svg { width:16px; height:16px; }
.new-note-hero { border:0; width:100%; display:flex; align-items:center; gap:15px; text-align:left; padding:16px; border-radius:20px; background:var(--purple); color:#fff; box-shadow:0 10px 22px rgba(111,92,244,.24); transition:transform .2s; }
.new-note-hero:hover { transform:translateY(-2px); }
.new-note-hero .plus-circle { display:grid; place-items:center; width:42px; height:42px; border-radius:14px; background:rgba(255,255,255,.18); flex-shrink:0; }
.new-note-hero svg { width:20px; height:20px; }
.new-note-hero strong,.new-note-hero small { display:block; }
.new-note-hero small { opacity:.72; margin-top:3px; }
.new-note-hero > svg { margin-left:auto; }
.section-heading,.subhead,.library-meta { display:flex; justify-content:space-between; align-items:center; }
.section-heading { margin:38px 0 17px; }
.section-heading h2 { font-size:20px; margin:0; letter-spacing:-.04em; }
.section-heading p { color:var(--muted); font-size:12px; margin:4px 0 0; }
.heading-actions { display:flex; gap:4px; align-items:center; }
.heading-actions button { border:0; background:transparent; color:var(--muted); padding:7px; }
.heading-actions svg { width:16px; height:16px; }
.heading-actions .active-view { color:var(--purple); background:var(--purple-soft); border-radius:8px; }
.text-action { display:flex; align-items:center; gap:2px; font-size:12px; color:var(--purple)!important; margin-left:8px; }
.text-action svg { width:13px; height:13px; }
.notes-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.notes-list,.library-list { display:flex; flex-direction:column; gap:11px; }
.note-row { display:flex; gap:12px; overflow:auto; padding-bottom:4px; }
.note-card { text-align:left; border:1px solid transparent; padding:17px; border-radius:18px; background:var(--card); box-shadow:var(--shadow); min-height:175px; display:flex; flex-direction:column; transition:transform .18s,box-shadow .18s; width:100%; }
.note-card:hover,.model-card:hover { transform:translateY(-3px); box-shadow:0 15px 35px rgba(44,37,76,.12); }
.note-row .note-card { min-width:210px; }
.note-card-head { display:flex; justify-content:space-between; color:var(--muted); font-size:10px; }
.note-type { display:flex; align-items:center; gap:5px; }
.note-type svg,.note-card-head > span:last-child svg { width:13px; height:13px; }
.note-card > strong { font-size:17px; margin:20px 0 7px; letter-spacing:-.03em; }
.note-card p { color:var(--muted); font-size:12px; line-height:1.45; margin:0; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.note-card-foot { display:flex; justify-content:space-between; margin-top:auto; color:var(--muted); font-size:10px; padding-top:13px; }
.note-card-foot svg { width:13px; height:13px; }
.subhead { margin:0 0 12px; }
.subhead span { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; }
.subhead svg { width:14px; height:14px; color:#e7ad4d; }
.subhead button { border:0; background:transparent; color:var(--purple); font-size:11px; }
.tone-coral { background:linear-gradient(145deg,var(--card),#fff3ef); }
.tone-sky { background:linear-gradient(145deg,var(--card),#eef8ff); }
.tone-mint { background:linear-gradient(145deg,var(--card),#effaf5); }
.tone-lavender { background:linear-gradient(145deg,var(--card),#f5f0ff); }
.tone-yellow { background:linear-gradient(145deg,var(--card),#fff9dc); }
.tone-peach { background:linear-gradient(145deg,var(--card),#fff0ea); }
.tone-rose { background:linear-gradient(145deg,var(--card),#fff0f2); }
.tone-blue { background:linear-gradient(145deg,var(--card),#eef3ff); }
.tone-green { background:linear-gradient(145deg,var(--card),#effaf1); }
.tone-paper { background:linear-gradient(145deg,#fffdf0,#fff7d6); }
.empty-state { text-align:center; padding:70px 20px; }
.empty-illustration { width:65px; height:65px; margin:auto; border-radius:22px; display:grid; place-items:center; color:var(--purple); background:var(--purple-soft); }
.empty-illustration svg { width:28px; height:28px; }
.empty-state h3 { margin:17px 0 7px; }
.empty-state p { color:var(--muted); font-size:13px; margin:0 auto 22px; max-width:300px; }
.primary-button { background:var(--purple); color:#fff; border:0; border-radius:12px; padding:12px 17px; display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:12px; }
.primary-button svg { width:16px; height:16px; }
.bottom-nav { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); width:min(92%,480px); padding:9px 13px; border:1px solid var(--line); border-radius:23px; background:color-mix(in srgb,var(--card) 90%,transparent); backdrop-filter:blur(15px); display:flex; justify-content:space-around; align-items:center; box-shadow:var(--shadow); z-index:5; }
.bottom-nav button { background:transparent; border:0; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:9px; padding:4px 6px; }
.bottom-nav svg { width:19px; height:19px; }
.bottom-nav .selected { color:var(--purple); }
.bottom-nav .nav-create { width:45px; height:45px; border-radius:16px; background:var(--purple); color:#fff; box-shadow:0 7px 14px #6f5cf455; }
.nav-create svg { width:22px; height:22px; }
.picker-page { padding:0 30px 50px; }
.picker-header { padding-left:0; padding-right:0; }
.step-count { color:var(--muted); font-size:11px; }
.picker-intro { margin:56px 0 34px; }
.picker-intro > p:last-child { color:var(--muted); font-size:13px; margin:18px 0 0; }
.model-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:13px; }
.model-card { border:1px solid transparent; text-align:left; border-radius:19px; padding:15px; min-height:245px; display:flex; flex-direction:column; transition:transform .18s,box-shadow .18s; }
.model-top { display:flex; align-items:center; justify-content:space-between; }
.model-top > svg { width:15px; height:15px; color:var(--muted); }
.model-number { color:var(--muted); font-size:10px; font-weight:700; }
.model-card .model-icon { width:36px; height:36px; border-radius:12px; }
.model-preview { white-space:pre-wrap; font-family:monospace; font-size:10px; line-height:1.55; color:#706a83; background:#ffffffaa; border-radius:11px; padding:11px; margin:15px 0; min-height:86px; }
.model-info { margin-top:auto; }
.model-info strong,.model-info span { display:block; }
.model-info strong { font-size:13px; }
.model-info span { color:var(--muted); font-size:10px; margin-top:4px; }
.all-page { padding-top:20px; }
.page-heading { display:flex; align-items:center; gap:15px; margin-bottom:27px; }
.page-heading h1 { font-size:33px; }
.page-heading .icon-button:last-child { margin-left:auto; }
.search-box { border:1px solid var(--line); background:var(--card); display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:14px; }
.search-box svg { width:17px; height:17px; color:var(--muted); flex-shrink:0; }
.search-box input { outline:0; border:0; width:100%; background:transparent; color:var(--foreground); font-size:13px; }
.filter-scroll { display:flex; gap:7px; overflow:auto; padding:16px 0 9px; }
.filter-scroll button { white-space:nowrap; border:1px solid var(--line); background:var(--card); border-radius:20px; padding:8px 12px; font-size:11px; color:var(--muted); }
.filter-scroll .filter-active { color:var(--purple); border-color:var(--purple); background:var(--purple-soft); }
.library-meta { margin:19px 0 15px; color:var(--muted); font-size:12px; }
.backup-actions { display:flex; gap:8px; }
.backup-actions button,.backup-actions label { display:flex; align-items:center; gap:5px; border:0; color:var(--purple); background:transparent; font-size:11px; }
.backup-actions svg { width:14px; height:14px; }
.backup-actions input { display:none; }
.trash-item { display:flex; align-items:center; gap:7px; padding:12px; border-radius:12px; background:var(--card); margin-top:8px; font-size:12px; box-shadow:var(--shadow); }
.trash-item span { margin-right:auto; }
.trash-item button { color:var(--purple); font-size:11px; display:flex; gap:4px; align-items:center; }
.trash-item button.danger { color:#d55; }
.trash-item svg { width:14px; height:14px; }
.editor-page { max-width:850px; padding:0 30px 40px; }
.editor-header { padding-left:0; padding-right:0; }
.editor-model { color:var(--muted); font-size:12px; }
.editor-model .model-icon { width:31px; height:31px; border-radius:10px; }
.editor-body { min-height:calc(100vh - 170px); background:var(--card); border-radius:22px; padding:30px 35px; box-shadow:var(--shadow); }
.title-input { width:100%; border:0; outline:0; background:transparent; font-size:30px; font-weight:800; letter-spacing:-.05em; color:var(--foreground); margin-bottom:26px; }
.content-input { width:100%; min-height:55vh; resize:none; border:0; outline:0; background:transparent; color:var(--foreground); font-size:16px; line-height:1.8; font-family:inherit; }
.editor-simple .content-input,.editor-yellow .content-input { background:repeating-linear-gradient(transparent 0,transparent 34px,#d9d5df 35px); }
.editor-grid .content-input { background-image:linear-gradient(#d8e1ed 1px,transparent 1px),linear-gradient(90deg,#d8e1ed 1px,transparent 1px); background-size:22px 22px; line-height:22px; }
.editor-yellow .editor-body { background:#fff7d7; color:#493c27; }
.drawing-canvas { width:100%; aspect-ratio:1.45; border:1px dashed var(--line); border-radius:14px; background:#fff; touch-action:none; }
.drawing-tools { display:flex; gap:18px; align-items:center; justify-content:space-between; padding-top:15px; color:var(--muted); font-size:12px; flex-wrap:wrap; }
.drawing-tools > div { display:flex; gap:7px; align-items:center; }
.drawing-tools button { display:flex; gap:5px; align-items:center; font-size:11px; }
.drawing-tools .color-dot { width:22px; height:22px; border-radius:50%; border:2px solid transparent; padding:0; }
.drawing-tools .color-selected { outline:3px solid var(--purple-soft); outline-offset:2px; }
.drawing-tools input[type=range] { accent-color:var(--purple); width:90px; }
.task-editor { display:flex; flex-direction:column; gap:12px; }
.task-row { display:flex; gap:10px; align-items:center; border-bottom:1px solid var(--line); padding-bottom:11px; }
.task-row input[type=checkbox] { accent-color:var(--purple); width:17px; height:17px; }
.task-row input[type=text] { flex:1; border:0; outline:0; background:transparent; color:var(--foreground); font-size:15px; }
.task-row input.done { text-decoration:line-through; color:var(--muted); }
.add-task { display:flex; align-items:center; gap:6px; color:var(--purple); font-size:13px; padding:6px 0; }
.add-task svg { width:15px; height:15px; }
.hidden { display:none !important; }
@media (max-width:760px) {
  .topbar,.content,.picker-page,.editor-page { padding-left:18px; padding-right:18px; }
  .welcome { align-items:start; flex-direction:column; gap:18px; }
  .cloud-status { align-self:flex-end; }
  .notes-grid { grid-template-columns:repeat(2,1fr); }
  .model-grid { grid-template-columns:repeat(2,1fr); gap:10px; }
  .model-card { min-height:220px; padding:12px; }
  .model-preview { font-size:9px; }
  .picker-intro { margin-top:35px; }
  .editor-body { padding:23px 18px; }
  .title-input { font-size:25px; }
  .text-action { display:none; }
}
@media (max-width:420px) {
  .notes-grid { gap:9px; }
  .note-card { padding:13px; min-height:160px; }
  .note-card > strong { margin-top:14px; font-size:15px; }
  .note-card p { font-size:11px; }
  .brand-tag { display:none; }
}
</style>
</head>

  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8a2 2 0 0 1-1.1 1.8L7 21h10l-.9-8.4a2 2 0 0 1-1.1-1.8V4h1V2H8v2h1Z"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
  restore:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 13"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>',
};
const starF = c => c ? c.replace('fill="none"','fill="currentColor"') : c;

/* ================= DATA ================= */
const MODELS = [
  { id:'simple', name:'Notas simples', desc:'Para textos e informações gerais', icon:'pen', tone:'coral', preview:'Uma ideia por linha...\nOrganize seus pensamentos\nsem complicação.' },
  { id:'grid', name:'Notas quadriculadas', desc:'Cálculos, esquemas e desenhos', icon:'grid', tone:'sky', preview:'x² + y² = r²\n┌───┬───┐\n│   │   │' },
  { id:'tasks', name:'Lista de tarefas', desc:'Acompanhe seu progresso', icon:'tasks', tone:'mint', preview:'✓ Revisar apresentação\n○ Comprar ingredientes\n○ Responder e-mails' },
  { id:'icons', name:'Notas com ícones', desc:'Ideias com marcadores visuais', icon:'sparkles', tone:'lavender', preview:'💡 Ideia principal\n📌 Ponto importante\n→ Próximo passo' },
  { id:'quick', name:'Notas rápidas', desc:'Capture antes que escape', icon:'zap', tone:'yellow', preview:'Ligar para a Ana\nantes das 18h' },
  { id:'reminder', name:'Lembretes', desc:'Data, horário e alertas', icon:'bell', tone:'peach', preview:'Hoje, 14:30\nEnviar orçamento\n🔔 Lembrar-me' },
  { id:'drawing', name:'Desenho livre', desc:'Solte a criatividade', icon:'palette', tone:'rose', preview:'   ╱╲  ✦\n  ╱  ╲\n ╱____╲' },
  { id:'categories', name:'Notas por categorias', desc:'Tudo no seu lugar', icon:'folder', tone:'blue', preview:'📁 Trabalho  12\n📁 Estudos   8\n📁 Pessoal   5' },
  { id:'images', name:'Notas com imagens', desc:'Fotos e textos juntos', icon:'image', tone:'green', preview:'┌────────────┐\n│  sua foto  │\n└────────────┘\nUma legenda...' },
  { id:'yellow', name:'Papel amarelado', desc:'O conforto de um caderno', icon:'book', tone:'paper', preview:'Querido diário,\n\nHoje foi um dia\nespecial porque...' },
];
const modelMap = Object.fromEntries(MODELS.map(m => [m.id, m]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
const now = () => new Date().toISOString();

/* ================= STATE ================= */
let notes = [];
let screen = 'home';       // home | models | all | trash | editor
let activeId = null;
let search = '', view = 'grid', filter = 'all';
let dark = localStorage.getItem('nf-dark') === '1';

function load() { try { notes = JSON.parse(localStorage.getItem('nf-notes') || '[]'); } catch { notes = []; } }
function save() { localStorage.setItem('nf-notes', JSON.stringify(notes)); localStorage.setItem('nf-dark', dark ? '1' : '0'); }
function active() { return notes.find(n => n.id === activeId) || null; }
function visible() {
  return notes.filter(n => !n.deleted &&
      (filter === 'all' || n.model === filter) &&
      (!search || (n.title + ' ' + n.content).toLowerCase().includes(search.toLowerCase())))
    .sort((a,b) => (b.pinned - a.pinned) || (new Date(b.updatedAt) - new Date(a.updatedAt)));
}

/* ================= ACTIONS ================= */
function go(s) { screen = s; render(); window.scrollTo(0,0); }
function createNote(model) {
  const note = { id: uid(), title:'', content:'', model, favorite:false, pinned:false, createdAt: now(), updatedAt: now(), tasks: model === 'tasks' ? [{text:'',done:false}] : undefined };
  notes.unshift(note); save(); activeId = note.id; go('editor');
}
function updateNote(patch) {
  const n = active(); if (!n) return;
  Object.assign(n, patch, { updatedAt: now() }); save(); render();
}
function duplicateNote() {
  const n = active(); if (!n) return;
  const copy = { ...JSON.parse(JSON.stringify(n)), id: uid(), title: (n.title || 'Nota') + ' (cópia)', createdAt: now(), updatedAt: now() };
  notes.unshift(copy); save(); activeId = copy.id; render();
}
function softDelete() {
  const n = active(); if (!n) return;
  n.deleted = true; n.updatedAt = now(); save(); activeId = null; go('home');
}
function restoreNote(id) { const n = notes.find(x => x.id === id); if (n) { n.deleted = false; save(); render(); } }
function hardDelete(id) { notes = notes.filter(x => x.id !== id); save(); render(); }
function togglePin() { const n = active(); if (n) updateNote({ pinned: !n.pinned }); }
function exportBackup() {
  const blob = new Blob([JSON.stringify(notes)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'noteflow-backup.json'; a.click();
  URL.revokeObjectURL(a.href);
}
function importBackup(ev) {
  const file = ev.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { try {
    const incoming = JSON.parse(String(reader.result));
    if (Array.isArray(incoming)) {
      incoming.filter(n => n.id && n.model).forEach(n => { n.id = uid(); notes.push(n); });
      save(); render();
    } else alert('Arquivo de backup inválido.');
  } catch { alert('Arquivo de backup inválido.'); } };
  reader.readAsText(file); ev.target.value = '';
}
function fmtDate(iso) { return new Date(iso).toLocaleDateString('pt-BR', { day:'2-digit', month:'short' }); }
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ================= RENDER ================= */
const app = document.getElementById('app');

function noteCard(n, compact) {
  const m = modelMap[n.model];
  const body = n.model === 'tasks' && n.tasks?.length
    ? n.tasks.filter(t => t.text).map(t => (t.done ? '✓ ' : '○ ') + t.text).join('\n')
    : n.content;
  return `<button class="note-card ${compact ? '' : ''} tone-${m.tone}" data-open="${n.id}">
    <div class="note-card-head"><span class="note-type">${I[m.icon]} ${m.name}</span><span>${n.favorite ? starF(I.star) : I.more}</span></div>
    <strong>${esc(n.title) || 'Sem título'}</strong>
    <p>${esc(body) || 'Comece a escrever uma nova ideia...'}</p>
    <div class="note-card-foot"><span>${fmtDate(n.updatedAt)}</span>${n.pinned ? I.pin : ''}</div>
  </button>`;
}

function render() {
  document.documentElement.classList.toggle('dark', dark);
  if (screen === 'models') return renderPicker();
  if (screen === 'editor' && active()) return renderEditor();
  renderHome();
}

function renderHome() {
  const vis = visible();
  const favs = vis.filter(n => n.favorite);
  const main = screen === 'trash'
    ? renderLibrary(true)
    : (screen === 'all' ? renderLibrary(false) : `
      <section class="welcome"><div><p class="eyebrow">BOM DIA, NICOLE</p><h1>O que vamos criar<br><em>hoje?</em></h1></div>
      <div class="cloud-status">${I.cloud}<span>Salvo no dispositivo</span></div></section>
      <button class="new-note-hero" data-go="models"><span class="plus-circle">${I.plus}</span><span><strong>Nova anotação</strong><small>Escolha um dos 10 estilos</small></span>${I.chevR}</button>
      <div class="section-heading"><div><h2>Notas recentes</h2><p>${vis.length ? vis.length + ' ' + (vis.length === 1 ? 'anotação' : 'anotações') + ' no total' : 'Comece a registrar suas ideias'}</p></div>
        <div class="heading-actions">
          <button class="${view === 'grid' ? 'active-view' : ''}" data-view="grid">${I.grid}</button>
          <button class="${view === 'list' ? 'active-view' : ''}" data-view="list">${I.list}</button>
          <button class="text-action" data-go="all">Ver todas ${I.chevR}</button>
        </div></div>
      ${favs.length ? `<section class="favorite-strip"><div class="subhead"><span>${starF(I.star)} Favoritas</span><button data-go="all">Ver todas</button></div><div class="note-row">${favs.slice(0,3).map(n => noteCard(n, true)).join('')}</div></section>` : ''}
      ${vis.length === 0
        ? `<div class="empty-state"><div class="empty-illustration">${I.pen}</div><h3>Seu espaço está pronto</h3><p>Escolha um modelo e transforme a primeira ideia em algo incrível.</p><button class="primary-button" data-go="models">${I.plus} Criar primeira anotação</button></div>`
        : `<div class="notes-${view}">${vis.slice(0,8).map(n => noteCard(n)).join('')}</div>`}`);

  app.innerHTML = `<div class="app-shell">
    <header class="topbar"><div class="brand-mark"><div class="brand-icon">${I.pen}</div><div><span class="brand-name">NoteFlow</span><span class="brand-tag">seu espaço para ideias</span></div></div>
      <div class="top-actions"><button class="icon-button" data-dark aria-label="Alternar tema">${dark ? I.sun : I.moon}</button><button class="avatar">N</button></div></header>
    <main class="content">${main}</main>
    <nav class="bottom-nav">
      <button class="${screen === 'home' ? 'selected' : ''}" data-go="home">${I.book}<span>Início</span></button>
      <button data-go="all">${I.search}<span>Buscar</span></button>
      <button class="nav-create" data-go="models">${I.plus}</button>
      <button class="${screen === 'all' ? 'selected' : ''}" data-go="all">${I.archive}<span>Notas</span></button>
      <button class="${screen === 'trash' ? 'selected' : ''}" data-go="trash">${I.trash}<span>Lixeira</span></button>
    </nav></div>`;
  bindCommon();
}

function renderLibrary(isTrash) {
  const list = isTrash ? notes.filter(n => n.deleted) : visible();
  return `<section class="all-page"><div class="page-heading"><button class="icon-button" data-go="home">${I.arrowL}</button>
    <div><p class="eyebrow">${isTrash ? 'EXCLUÍDAS' : 'BIBLIOTECA'}</p><h1>${isTrash ? 'Lixeira' : 'Todas as notas'}</h1></div>
    <button class="icon-button" data-go="models">${I.menu}</button></div>
  ${isTrash ? '' : `<div class="search-box">${I.search}<input id="searchInput" value="${esc(search)}" placeholder="Buscar nas suas notas..."></div>
  <div class="filter-scroll"><button class="${filter === 'all' ? 'filter-active' : ''}" data-filter="all">Todas</button>${MODELS.map(m => `<button class="${filter === m.id ? 'filter-active' : ''}" data-filter="${m.id}">${m.name}</button>`).join('')}</div>`}
  <div class="library-meta"><span>${list.length} ${list.length === 1 ? 'nota' : 'notas'}</span>
  ${isTrash ? '' : `<div class="backup-actions"><button data-export>${I.download} Backup</button><label>${I.upload} Importar<input type="file" id="importInput" accept="application/json"></label></div>`}</div>
  <div class="library-list">${list.length ? (isTrash
      ? list.map(n => `<div class="trash-item"><span>${esc(n.title) || 'Nota sem título'}</span><button data-restore="${n.id}">${I.restore} Restaurar</button><button class="danger" data-del="${n.id}">${I.trash} Excluir</button></div>`).join('')
      : list.map(n => noteCard(n)).join(''))
    : `<div class="empty-state"><div class="empty-illustration">${I.pen}</div><h3>Nada por aqui</h3><p>${isTrash ? 'A lixeira está vazia.' : 'Crie sua primeira anotação para começar.'}</p></div>`}</div>
  </section>`;
}

function renderPicker() {
  app.innerHTML = `<div class="picker-page"><header class="picker-header">
    <button class="icon-button" data-go="home">${I.arrowL}</button>
    <div class="mini-brand"><div class="brand-icon">${I.pen}</div><span>NoteFlow</span></div>
    <span class="step-count">01 / 01</span></header>
  <div class="picker-intro"><p class="eyebrow">COMECE DO SEU JEITO</p><h1>Como você quer<br><em>fazer sua anotação?</em></h1><p>Escolha um estilo. Você poderá mudar e organizar tudo depois.</p></div>
  <div class="model-grid">${MODELS.map((m,i) => `<button class="model-card tone-${m.tone}" data-model="${m.id}">
    <div class="model-top"><span class="model-number">0${i+1}</span><span class="model-icon">${I[m.icon]}</span>${I.chevR}</div>
    <div class="model-preview">${esc(m.preview)}</div>
    <div class="model-info"><strong>${m.name}</strong><span>${m.desc}</span></div></button>`).join('')}</div></div>`;
  bindCommon();
}

function renderEditor() {
  const n = active(); const m = modelMap[n.model];
  let body = '';
  if (n.model === 'tasks') {
    body = `<div class="task-editor" id="taskEditor">${(n.tasks || []).map((t,i) => `
      <div class="task-row"><input type="checkbox" data-task-check="${i}" ${t.done ? 'checked' : ''}>
      <input type="text" data-task-text="${i}" class="${t.done ? 'done' : ''}" value="${esc(t.text)}" placeholder="Adicionar tarefa..."></div>`).join('')}
      <button class="add-task" data-add-task>${I.plus} Adicionar tarefa</button></div>`;
  } else if (n.model === 'drawing') {
    body = `<canvas class="drawing-canvas" id="canvas" width="900" height="620"></canvas>
      <div class="drawing-tools"><div>Cor: ${['#6f5cf4','#e5484d','#2f9e6e','#e7ad4d','#292633'].map(c => `<button class="color-dot ${c==='#6f5cf4'?'color-selected':''}" data-color="${c}" style="background:${c}" aria-label="Cor ${c}"></button>`).join('')}</div>
      <div>Espessura: <input type="range" id="brushWidth" min="1" max="20" value="4"></div>
      <button data-clear-canvas>${I.trash} Limpar</button></div>`;
  } else {
    body = `<textarea class="content-input" id="contentInput" placeholder="Escreva sua ideia aqui...">${esc(n.content)}</textarea>`;
  }
  app.innerHTML = `<div class="editor-page editor-${n.model}">
    <header class="editor-header"><button class="icon-button" data-go="home">${I.arrowL}</button>
      <div class="editor-model"><span class="model-icon">${I[m.icon]}</span><span>${m.name}</span></div>
      <div class="editor-actions">
        <button class="icon-button" data-fav title="Favoritar">${n.favorite ? starF(I.star) : I.star}</button>
        <button class="icon-button" data-pin title="Fixar">${n.pinned ? I.pin : I.pin}</button>
        <button class="icon-button" data-dup title="Duplicar">${I.copy}</button>
        <button class="icon-button" data-del-active title="Excluir">${I.trash}</button>
      </div></header>
    <div class="editor-body">
      <input class="title-input" id="titleInput" value="${esc(n.title)}" placeholder="Dê um título à sua ideia">
      ${body}
    </div></div>`;
  bindCommon();
  bindEditor();
}

/* ================= EVENTS ================= */
function bindCommon() {
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { if (b.dataset.go !== 'editor') activeId = b.dataset.go === 'home' ? activeId : activeId; go(b.dataset.go); });
  app.querySelectorAll('[data-dark]').forEach(b => b.onclick = () => { dark = !dark; save(); render(); });
  app.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { view = b.dataset.view; render(); });
  app.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { filter = b.dataset.filter; render(); });
  app.querySelectorAll('[data-model]').forEach(b => b.onclick = () => createNote(b.dataset.model));
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { activeId = b.dataset.open; go('editor'); });
  app.querySelectorAll('[data-restore]').forEach(b => b.onclick = () => restoreNote(b.dataset.restore));
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { if (confirm('Excluir permanentemente?')) hardDelete(b.dataset.del); });
  const si = document.getElementById('searchInput');
  if (si) { si.oninput = () => { search = si.value; const pos = si.selectionStart; render(); const el = document.getElementById('searchInput'); el.focus(); el.setSelectionRange(pos, pos); }; }
  const ii = document.getElementById('importInput');
  if (ii) ii.onchange = importBackup;
  app.querySelectorAll('[data-export]').forEach(b => b.onclick = exportBackup);
}

function bindEditor() {
  const n = active(); if (!n) return;
  const t = document.getElementById('titleInput');
  if (t) t.oninput = () => updateNote({ title: t.value });
  const c = document.getElementById('contentInput');
  if (c) c.oninput = () => updateNote({ content: c.value });
  app.querySelectorAll('[data-fav]').forEach(b => b.onclick = () => updateNote({ favorite: !n.favorite }));
  app.querySelectorAll('[data-pin]').forEach(b => b.onclick = () => togglePin());
  app.querySelectorAll('[data-dup]').forEach(b => b.onclick = duplicateNote);
  app.querySelectorAll('[data-del-active]').forEach(b => b.onclick = () => { if (confirm('Mover para a lixeira?')) softDelete(); });
  app.querySelectorAll('[data-task-check]').forEach(el => el.onchange = () => {
    const tasks = JSON.parse(JSON.stringify(n.tasks || [])); tasks[+el.dataset.taskCheck].done = el.checked; updateNote({ tasks });
  });
  app.querySelectorAll('[data-task-text]').forEach(el => el.oninput = () => {
    const tasks = JSON.parse(JSON.stringify(n.tasks || [])); tasks[+el.dataset.taskText].text = el.value; updateNote({ tasks });
  });
  app.querySelectorAll('[data-add-task]').forEach(b => b.onclick = () => {
    updateNote({ tasks: [...(n.tasks || []), { text:'', done:false }] });
    setTimeout(() => { const rows = document.querySelectorAll('[data-task-text]'); const last = rows[rows.length-1]; if (last) last.focus(); }, 50);
  });
  const canvas = document.getElementById('canvas');
  if (canvas) setupCanvas(canvas, n);
}

function setupCanvas(canvas, note) {
  const ctx = canvas.getContext('2d');
  let color = '#6f5cf4', width = 4, drawing = false;
  if (note.drawing) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = note.drawing; }
  const pos = e => { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) }; };
  canvas.onpointerdown = e => { canvas.setPointerCapture(e.pointerId); const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); drawing = true; };
  canvas.onpointermove = e => { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.stroke(); };
  canvas.onpointerup = () => { drawing = false; updateNote({ drawing: canvas.toDataURL() }); };
  app.querySelectorAll('[data-color]').forEach(b => b.onclick = () => {
    color = b.dataset.color;
    app.querySelectorAll('[data-color]').forEach(x => x.classList.remove('color-selected'));
    b.classList.add('color-selected');
  });
  const bw = document.getElementById('brushWidth');
  if (bw) bw.oninput = () => { width = +bw.value; };
  app.querySelectorAll('[data-clear-canvas]').forEach(b => b.onclick = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height); updateNote({ drawing: '' });
  });
}

/* ================= INIT ================= */
load(); render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
